# Cloud krok 6: CI – každá změna se sestaví a otestuje na čistém stroji (runner = dočasná Linux VM od GitHubu).
# Testy nepotřebují RabbitMQ: sága běží nad InProcessIntegrationBus. Databáze: skutečný PostgreSQL v Dockeru runneru
# (Testcontainers, škálování krok 2 a 3C).
name: CI

on:
  push:
    branches: [main]
    # Krok 8: změna jen dokumentace po sloučení nic nestaví ani nenasazuje (testy proběhly už v PR).
    # Výjimka: příručka v aplikaci (docs/prirucka, /Docs) je součást image Webu – její změna se nasadit musí.
    # Pořadí vzorů je důležité: rozhoduje poslední, který na soubor pasuje.
    # U pull_request se NEfiltruje – povinný check "Build a testy" musí dorazit u každého PR, jinak by nešel sloučit.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/prirucka/**'
  pull_request:
  workflow_dispatch:        # ruční spuštění tlačítkem "Run workflow" v záložce Actions

# Nový push do stejného PR zruší ještě běžící starší běh – výsledek starého commitu už nikoho nezajímá.
# Na main se nic neruší (krok 8): rozběhnutá publikace a nasazení se dokončí, další běh počká.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nejmenší oprávnění: workflow jen čte kód. Zápis do registry má jen job "images" (krok 7).
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build a testy
    # Pevná verze, ne ubuntu-latest: prostředí se nezmění pod rukama (latest přešel 10/2026 na Ubuntu 26).
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: .NET SDK podle global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # NuGet balíčky se mezi běhy pamatují. Klíč = otisk všech .csproj a .props – změní se jen při změně závislostí.
      - name: Cache NuGet balíčků
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MiniShop.slnx

      - name: Build
        run: dotnet build MiniShop.slnx --configuration Release --no-restore

      - name: Testy
        run: >
          dotnet test MiniShop.slnx --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # Observabilita G3: alarmy pro Grafanu (deploy/grafana) se importují ručně – chybný PromQL by se poznal až v Grafaně.
      # promtool = oficiální kontrola pravidel Prometheu (syntaxe YAML i dotazů).
      - name: Kontrola alarmů Grafany (promtool)
        run: >
          docker run --rm -v "$PWD/deploy/grafana:/rules:ro" --entrypoint promtool prom/prometheus:v3.5.0
          check rules /rules/minishop-alarmy.yaml

      # Výsledky testů ke stažení u běhu (i když testy selžou – právě pak jsou nejzajímavější).
      - name: Výsledky testů jako artefakt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 14

  # Cloud krok 7: Docker image obou služeb.
  #   pull request → jen zkušební sestavení pro x86 (rozbitý Dockerfile se pozná před sloučením), nic se neukládá,
  #   main         → sestavení pro x86 i ARM a push do GHCR s tagy sha-<commit> a latest.
  # Běží až po zelených testech (needs) – do registry se nedostane image z kódu, který neprošel.
  images:
    name: Image ${{ matrix.service }}
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        service: [web, inventory-api]
        include:
          - service: web
            dockerfile: src/MiniShop.Web/Dockerfile
          - service: inventory-api
            dockerfile: src/MiniShop.Inventory.Api/Dockerfile

    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    # Zápis do registry jen pro tento job (ostatní joby mají jen čtení).
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Emulace ARM na x86 runneru. Kompilace .NET jede nativně (FROM --platform=$BUILDPLATFORM v Dockerfile),
      # emuluje se jen závěrečná fáze (RUN mkdir/chown nad runtime image pro ARM).
      - name: QEMU (emulace ARM)
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Přihlášení do GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Jména a štítky: ghcr.io/ftichy/minishop-web:sha-1a2b3c4 a :latest.
      # Label org.opencontainers.image.source propojí balíček s repozitářem (zdědí jeho viditelnost).
      - name: Tagy a labely
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/minishop-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build${{ env.PUBLISH == 'true' && ' a push' || ' (zkušební)' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vrstvy (restore NuGet, runtime image) se pamatují v cache GitHub Actions – další build je rychlejší.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # E2E testy v prohlížeči (Playwright, tests/MiniShop.E2E): celý e-shop se spustí v Compose (Web + Inventory.Api + PostgreSQL +
  # RabbitMQ + Mailpit z deploy/compose.e2e.yaml) a Chromium projde nákupní cestu jako zákazník a admin.
  # Zatím NENÍ povinný check a nic neblokuje (needs na něj nikdo nemá) – job „Build a testy“ zůstává beze změny.
  # Žádné secrets: hesla pro Compose i admina se generují za běhu a po jobu zanikají s runnerem.
  e2e:
    name: E2E testy
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      COMPOSE_FILE: compose.yaml:compose.e2e.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: .NET SDK podle global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet balíčků
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Stejné cache vrstev (scope) jako job „images“ – build je rychlý, když se Dockerfile nezměnil.
      # load: true = image skončí v lokálním Dockeru jako minishop-web:local (tak ho čeká compose.yaml).
      - name: Build image web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/MiniShop.Web/Dockerfile
          load: true
          tags: minishop-web:local
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build image inventory-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/MiniShop.Inventory.Api/Dockerfile
          load: true
          tags: minishop-inventory-api:local
          cache-from: type=gha,scope=inventory-api
          cache-to: type=gha,scope=inventory-api,mode=max

      # Tajné hodnoty vzniknou tady a jen pro tento běh (deploy/.env je v .gitignore). Heslo RabbitMQ a PostgreSQL
      # jen z hex znaků – jsou součástí connection stringů.
      - name: Konfigurace Compose (hesla za běhu)
        working-directory: deploy
        run: |
          {
            echo "RABBITMQ_USER=minishop"
            echo "RABBITMQ_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "INVENTORY_API_KEY=$(openssl rand -hex 32)"
            echo "PAYMENTS_WEBHOOK_SECRET=$(openssl rand -hex 32)"
            echo "WEB_PORT=8080"
            echo "IMAGE_TAG=local"
          } > .env

      - name: Spuštění aplikace
        working-directory: deploy
        run: docker compose up -d --no-build --wait --wait-timeout 240

      # Admin pro scénář expedice. Heslo se čte ze vstupu (create-admin ho zvládne i z roury), v logu je zamaskované.
      - name: Admin pro testy
        working-directory: deploy
        run: |
          ADMIN_PASSWORD="E2e-$(openssl rand -hex 16)"
          echo "::add-mask::$ADMIN_PASSWORD"
          printf '%s\n%s\n' "$ADMIN_PASSWORD" "$ADMIN_PASSWORD" \
            | docker compose exec -T web dotnet MiniShop.Web.dll create-admin --email e2e-admin@example.test --name "E2E Admin"
          echo "E2E_ADMIN_EMAIL=e2e-admin@example.test" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Build E2E testů
        run: dotnet build tests/MiniShop.E2E/MiniShop.E2E.csproj --configuration Release

      # Jen Chromium (rychlost). --with-deps doinstaluje systémové knihovny prohlížeče.
      - name: Chromium pro Playwright
        run: pwsh tests/MiniShop.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: E2E testy
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_MAILPIT_URL: http://localhost:8025
          E2E_ARTIFACTS_DIR: ${{ github.workspace }}/e2e-artifacts
        run: dotnet test tests/MiniShop.E2E/MiniShop.E2E.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Logy kontejnerů při selhání
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color --tail 300 web inventory-api > ../e2e-artifacts-compose.log || true

      # Při selhání: Playwright trace (.trace.zip – otevřít na trace.playwright.dev), snímky stránek a logy služeb.
      - name: Trace, snímky a logy jako artefakt
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            e2e-artifacts/
            e2e-artifacts-compose.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Zastavení aplikace
        if: always()
        working-directory: deploy
        run: docker compose down -v

  # Bezpečnost C: OWASP ZAP baseline = PASIVNÍ sken (nic neútočí, jen prochází stránky jako návštěvník a čte odpovědi –
  # hlavičky, cookies, CSP, chybové stránky, knihovny se známou zranitelností). Aplikace běží v Compose jako v produkci
  # (jen compose.yaml, bez E2E doplňku). Pravidla s odůvodněním: .github/zap/rules.tsv (FAIL = job zčervená, IGNORE = neplatí pro nás).
  # Stejně jako E2E: NENÍ povinný check, nasazení na něm nezávisí, žádné secrets.
  zap:
    name: ZAP sken
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      # Verzi zvedat ručně (Dependabot příkazy docker run nehlídá): https://github.com/zaproxy/zaproxy/releases
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/MiniShop.Web/Dockerfile
          load: true
          tags: minishop-web:local
          cache-from: type=gha,scope=web

      - name: Build image inventory-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/MiniShop.Inventory.Api/Dockerfile
          load: true
          tags: minishop-inventory-api:local
          cache-from: type=gha,scope=inventory-api

      - name: Konfigurace Compose (hesla za běhu)
        working-directory: deploy
        run: |
          {
            echo "RABBITMQ_USER=minishop"
            echo "RABBITMQ_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "INVENTORY_API_KEY=$(openssl rand -hex 32)"
            echo "PAYMENTS_WEBHOOK_SECRET=$(openssl rand -hex 32)"
            echo "WEB_PORT=8080"
            echo "IMAGE_TAG=local"
          } > .env

      - name: Spuštění aplikace
        working-directory: deploy
        run: docker compose up -d --no-build --wait --wait-timeout 240

      # ZAP běží v síti Compose (minishop_default) a jde na Web jménem služby. Pracovní složka /zap/wrk = pravidla
      # dovnitř, reporty ven; kontejner ZAP běží pod jiným uživatelem, proto chmod.
      # -m 2 = pavouk 2 minuty, -I = varování (WARN) job neshodí, jen pravidla FAIL.
      - name: ZAP baseline sken
        run: |
          mkdir -p zap-report
          cp .github/zap/rules.tsv zap-report/
          chmod -R a+rwX zap-report
          docker run --rm --network minishop_default -v "$PWD/zap-report:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://web:8080 -c rules.tsv -m 2 -I \
            -r zap-report.html -w zap-report.md -J zap-report.json

      - name: Souhrn do přehledu běhu
        if: always()
        run: |
          if [ -f zap-report/zap-report.md ]; then cat zap-report/zap-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Report jako artefakt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: |
            zap-report/zap-report.html
            zap-report/zap-report.md
            zap-report/zap-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Zastavení aplikace
        if: always()
        working-directory: deploy
        run: docker compose down -v

  # Cloud krok 8: po publikaci image z main se commit sám nasadí na VM (workflow deploy.yml).
  deploy:
    name: Nasazení
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
