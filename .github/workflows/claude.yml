# Agent Claude v issues a PR: komentář s "@claude" spustí Claude Code na runneru GitHubu.
# Postup práce (analýza → souhlas → vývoj → PR) a pravidla jsou v CLAUDE.md, sekce "Práce v GitHub Issues".
# Přihlášení: token předplatného Claude (claude setup-token) v secretu repozitáře CLAUDE_CODE_OAUTH_TOKEN.
# Bezpečnost: job nemá environment production (žádné secrets nasazení ani aplikace), nesmí spouštět workflow
# a do main zapsat nemůže (ruleset main-protection) – výsledek je vždy PR, který slučuje člověk.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# Jeden běh na issue/PR najednou – další komentář počká, rozdělaná práce se nepřeruší.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write         # větev claude/… a commity
  issues: write           # komentáře v issue
  pull-requests: write    # otevření PR a odpovědi v něm
  id-token: write         # výměna za token GitHub aplikace Claude (její push spustí CI, GITHUB_TOKEN by ho nespustil)
  actions: read           # agent vidí výsledky CI svého PR

jobs:
  claude:
    # Repozitář je veřejný: spustit smí jen vlastník/spolupracovník (komentář cizího člověka runner ani nespustí).
    # Akce navíc sama ověřuje právo zápisu.
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Stejné SDK jako CI – agent spouští build a testy (PostgreSQL přes Testcontainers v Dockeru runneru).
      - name: .NET SDK podle global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet balíčků
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Povolené nástroje: čtení a úpravy kódu, build/testy/migrace, git na vlastní větvi, PR a issue přes gh.
          # Nic dalšího (žádný curl, docker, ssh) – agent nemá důvod sahat mimo repozitář.
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet tool restore),Bash(dotnet ef migrations add:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh issue view:*)"
