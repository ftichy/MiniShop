# Cloud krok 2: celý MiniShop v kontejnerech bez Aspire – "produkce na mém PC".
# Stejný soubor poběží v kroku 4 na VM v cloudu.
#
#   cd deploy
#   cp .env.example .env        # jednou: heslo k RabbitMQ (soubor .env je v .gitignore)
#   docker compose up -d --build
#   → http://localhost:8080
#
# Co dřív dělal AppHost (src/MiniShop.AppHost/AppHost.cs), dělá teď tento soubor:
#   AddRabbitMQ(...)                → služba "rabbitmq"
#   AddProject<...>("inventory-api") → služba "inventory-api" (jméno = adresa v síti Compose), stejně "reporting-api"
#   WithReference(messaging)        → proměnná ConnectionStrings__messaging
#   WithReference(inventoryApi)     → proměnná Services__inventory-api__http__0
#   WaitFor(...)                    → depends_on + condition: service_healthy

name: minishop

# Společná kontrola stavu obou .NET služeb (YAML "kotva" &dotnet-healthcheck, použitá níže přes *).
# Image nemá curl, ale má bash: /dev/tcp otevře TCP spojení, pošleme ručně HTTP požadavek na /health
# a hledáme v odpovědi status 200. Unhealthy vrací 503 → kontrola selže.
x-dotnet-healthcheck: &dotnet-healthcheck
  test:
    - CMD
    - bash
    - -c
    - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 30s

# Cloud krok 11: telemetrie (trasy, logy, metriky) do Aspire dashboardu – stejně jako lokálně přes AppHost.
# ServiceDefaults exportují OTLP jen tehdy, když je nastavené OTEL_EXPORTER_OTLP_ENDPOINT (kód se nemění).
# OTEL_SERVICE_NAME = jméno služby v dashboardu (lokálně ho nastavuje Aspire).
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889

# Škálování krok 1 a 3C: databáze služeb = PostgreSQL (služba "postgres"), každý modul ve vlastním schématu.
x-database-env: &database-env
  ConnectionStrings__minishop: Host=postgres;Database=minishop;Username=minishop;Password=${POSTGRES_PASSWORD}

services:
  # Jedna databáze "minishop", každý modul ve vlastním schématu (ordering, inventory, …).
  # Heslo platí jen při založení prázdného volume – výměnu v běžící databázi dělá deploy.sh (ALTER USER).
  # Port 5432 jen z tohoto počítače (psql, pgAdmin) – z internetu ani ze sítě ne.
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: minishop
      POSTGRES_USER: minishop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chybí POSTGRES_PASSWORD v .env}
    # Škálování krok 5: zámek vedoucí kopie drží spojení. Když kopie zmizí bez rozloučení (pád stroje, síť),
    # TCP keepalive ho serveru ohlásí jako mrtvé do ~1 min (30 s + 3× 10 s) a zámek se uvolní – výchozí jsou 2 hodiny.
    command: ["postgres", "-c", "tcp_keepalives_idle=30", "-c", "tcp_keepalives_interval=10", "-c", "tcp_keepalives_count=3"]
    volumes:
      # PostgreSQL 18: volume na /var/lib/postgresql (data v podsložce 18/docker – usnadní budoucí upgrade verze).
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    # Pojistka pro malou VM (jako u dashboardu); MiniShop potřebuje řádově desítky MB.
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "minishop", "-d", "minishop"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # Cloud krok 11: samostatný Aspire dashboard. Telemetrii drží jen v paměti (restart = prázdný).
  # Lokálně http://localhost:18888, na VM https://dashboard.<doména> přes Caddy s heslem (compose.cloud.yaml).
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    restart: unless-stopped
    environment:
      DASHBOARD__APPLICATIONNAME: MiniShop
      # Přihlášení řeší Caddy (basic auth) – port dashboardu není z internetu přímo dostupný.
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      # OTLP (18889) jen uvnitř sítě Compose – posílat sem můžou jen naše kontejnery.
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      # Jen z tohoto počítače (127.0.0.1). OTLP port 18889 ven nepublikujeme.
      - "127.0.0.1:18888:18888"
    # Telemetrie v paměti roste až k limitům dashboardu (10 000 tras/logů na službu) – pojistka pro malou VM.
    mem_limit: 512m

  rabbitmq:
    image: rabbitmq:4-management
    # Pevné jméno uzlu: RabbitMQ ukládá data do složky pojmenované podle hostname.
    # Bez něj by nový kontejner dostal náhodné jméno a fronty z volume by "nenašel".
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      # Uživatel "guest" smí jen z localhostu uvnitř kontejneru – služby se proto přihlašují vlastním účtem.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?chybí .env – zkopírujte .env.example do .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?chybí .env – zkopírujte .env.example do .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # Jen management UI a jen z tohoto počítače (127.0.0.1). Port 5672 ven nepotřebujeme –
      # služby se k RabbitMQ připojují uvnitř sítě Compose. 15673, aby se nepraly s minishop-rabbit (15672).
      - "127.0.0.1:15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  inventory-api:
    # Krok 7: na VM IMAGE_PREFIX=ghcr.io/ftichy/ → image z registry; lokálně prázdný → image z build:.
    image: ${IMAGE_PREFIX:-}minishop-inventory-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: src/MiniShop.Inventory.Api/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*otel-env, *database-env]
      OTEL_SERVICE_NAME: inventory-api
      ConnectionStrings__messaging: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # Účty krok 7: servisní klíč – /api skladu jen pro Web. Bez něj se Compose ani nespustí (:?).
      InventoryApi__ApiKey: ${INVENTORY_API_KEY:?Chybí INVENTORY_API_KEY v .env}
    volumes:
      - inventory-data:/data
    # Žádné "ports": sklad je dostupný jen uvnitř sítě Compose (pro Web), zvenku ne.
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  # Mikroservisy M1: přehled tržeb jako samostatná služba (fronta minishop.reporting, schéma reporting).
  # Web na ní nezávisí (depends_on ne) – bez ní běží e-shop dál, jen stránka Přehled tržeb ukáže upozornění.
  reporting-api:
    image: ${IMAGE_PREFIX:-}minishop-reporting-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: src/MiniShop.Reporting.Api/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*otel-env, *database-env]
      OTEL_SERVICE_NAME: reporting-api
      ConnectionStrings__messaging: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # Vlastní servisní klíč (ne klíč skladu) – /api přehledu jen pro Web. Bez něj se Compose ani nespustí (:?).
      ReportingApi__ApiKey: ${REPORTING_API_KEY:?Chybí REPORTING_API_KEY v .env}
    volumes:
      - reporting-data:/data   # jen logy (/data/logs) – data jsou v PostgreSQL
    # Žádné "ports": jen uvnitř sítě Compose (pro Web).
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  # Mikroservisy M2C: Notifications (e-maily a oznámení push) jako samostatná služba (fronta minishop.notifications, schéma
  # notifications). Data jiných modulů bere z interního API Webu (/internal/…). Web na ní nezávisí (depends_on ne) –
  # bez ní běží e-shop dál, e-maily počkají ve frontě.
  notifications-api:
    image: ${IMAGE_PREFIX:-}minishop-notifications-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: src/MiniShop.Notifications.Api/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*otel-env, *database-env]
      OTEL_SERVICE_NAME: notifications-api
      ConnectionStrings__messaging: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # Vlastní servisní klíč – /api služby jen pro Web. Bez něj se Compose ani nespustí (:?).
      NotificationsApi__ApiKey: ${NOTIFICATIONS_API_KEY:?Chybí NOTIFICATIONS_API_KEY v .env}
      # Interní API Webu (M2A): kontakt zákazníka, role zaměstnanců, název produktu, PDF faktur. Jméno "web" vrací IP
      # všech kopií Webu (DNS v síti Compose).
      Services__web__http__0: http://web:8080
      WebInternalApi__ApiKey: ${WEB_INTERNAL_API_KEY:?Chybí WEB_INTERNAL_API_KEY v .env}
      # E-maily o objednávkách (stejné SMTP jako e-maily účtu ve Webu; produkce Gmail – production.env + secret SMTP_PASSWORD).
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__UserName: ${EMAIL_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-minishop@localhost}
      # Odkazy v e-mailech a oznámeních (/Orders/{id}).
      Notifications__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # E-shop krok 23: oznámení push – pár klíčů VAPID (veřejný v production.env, soukromý secret PUSH_VAPID_PRIVATE_KEY).
      PushNotifications__VapidPublicKey: ${PUSH_VAPID_PUBLIC_KEY:-}
      PushNotifications__VapidPrivateKey: ${PUSH_VAPID_PRIVATE_KEY:-}
    volumes:
      - notifications-data:/data   # jen logy (/data/logs) – data jsou v PostgreSQL
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  # E-shop krok 26A: simulovaný dopravce – „cizí firma“ (vlastní data v souboru, žádná databáze MiniShopu, RabbitMQ ani
  # telemetrie). Web ho volá od kroku 26B, webhooky o stavu posílá od 26C (Carrier__WebhookUrl). Nasazuje se jako
  # infrastruktura (krátký restart = dopravce chvíli neodpovídá, což musí e-shop stejně snést).
  carrier-sim:
    image: ${IMAGE_PREFIX:-}minishop-carrier-sim:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: src/MiniShop.CarrierSimulator/Dockerfile
    restart: unless-stopped
    environment:
      # Klíč e-shopu u dopravce a tajemství podpisu webhooků. Bez nich se Compose ani nespustí (:?).
      Carrier__ApiKey: ${CARRIER_API_KEY:?Chybí CARRIER_API_KEY v .env}
      Carrier__WebhookSecret: ${CARRIER_WEBHOOK_SECRET:?Chybí CARRIER_WEBHOOK_SECRET v .env}
      Carrier__WebhookUrl: ${CARRIER_WEBHOOK_URL:-}
      Carrier__StepSeconds: ${CARRIER_STEP_SECONDS:-30}
      # „Zlobení“ (0–1): 503, ztracená odpověď, webhook dvakrát / mimo pořadí / vůbec. Produkce v production.env.
      Carrier__Chaos__FailureRate: ${CARRIER_CHAOS_FAILURE_RATE:-0}
      Carrier__Chaos__LostResponseRate: ${CARRIER_CHAOS_LOST_RESPONSE_RATE:-0}
      Carrier__Chaos__DuplicateRate: ${CARRIER_CHAOS_DUPLICATE_RATE:-0}
      Carrier__Chaos__ReorderRate: ${CARRIER_CHAOS_REORDER_RATE:-0}
      Carrier__Chaos__DropRate: ${CARRIER_CHAOS_DROP_RATE:-0}
      Carrier__Chaos__RejectRate: ${CARRIER_CHAOS_REJECT_RATE:-0}
    volumes:
      - carrier-data:/data
    # Žádné "ports": dopravce je dostupný jen uvnitř sítě Compose (pro Web).
    mem_limit: 256m
    healthcheck: *dotnet-healthcheck

  web:
    image: ${IMAGE_PREFIX:-}minishop-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: src/MiniShop.Web/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*otel-env, *database-env]
      OTEL_SERVICE_NAME: web
      ConnectionStrings__messaging: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # Jméno služby "inventory-api" je zároveň DNS jméno kontejneru v síti Compose.
      Services__inventory-api__http__0: http://inventory-api:8080
      # Účty krok 7: stejný servisní klíč – Web ho posílá v hlavičce X-Api-Key.
      InventoryApi__ApiKey: ${INVENTORY_API_KEY:?Chybí INVENTORY_API_KEY v .env}
      # Mikroservisy M1: přehled tržeb (stránka /Admin/Sales) ze služby reporting-api s jejím servisním klíčem.
      Services__reporting-api__http__0: http://reporting-api:8080
      ReportingApi__ApiKey: ${REPORTING_API_KEY:?Chybí REPORTING_API_KEY v .env}
      # Mikroservisy M2A: klíč interního API Webu (/internal/…) – služby (od M2C Notifications) se jím ptají Webu.
      WebInternalApi__ApiKey: ${WEB_INTERNAL_API_KEY:?Chybí WEB_INTERNAL_API_KEY v .env}
      # E-shop krok 8: tajemství pro podpis webhooku platební brány – bez něj se Web nespustí.
      Payments__WebhookSecret: ${PAYMENTS_WEBHOOK_SECRET:?Chybí PAYMENTS_WEBHOOK_SECRET v .env}
      # Za reverse proxy (Caddy, krok 5) věřit hlavičkám X-Forwarded-Proto/For. Bez proxy nic nemění.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Příručka (/Docs) odkazuje do kódu na GitHubu na commit, ze kterého je image ("sha-…"); jinak na main.
      Documentation__Commit: ${IMAGE_TAG:-}
      # Účty krok 5: e-maily přes SMTP. Bez EMAIL_HOST (lokální Compose) se jen zapisují do logu.
      # Produkce: netajné hodnoty v production.env, heslo aplikace Gmailu je secret SMTP_PASSWORD.
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__UserName: ${EMAIL_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-minishop@localhost}
      # Veřejná adresa webu (odkazy, Stripe návrat). E-maily o objednávkách posílá od M2C služba notifications-api.
      Notifications__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # Účty krok 10: přihlášení přes Google (OAuth klient z Google Cloud Console). Bez obou hodnot se tlačítko neukáže.
      # Produkce: Client ID v production.env (není tajné), tajemství je secret GOOGLE_CLIENT_SECRET.
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      # E-shop krok 16: platební brána – Fake (simulace, výchozí) nebo Stripe (testovací režim; bez obou klíčů se Web
      # nespustí). Produkce: PAYMENTS_GATEWAY v production.env, klíče jsou secrets STRIPE_SECRET_KEY a STRIPE_WEBHOOK_SECRET.
      Payments__Gateway: ${PAYMENTS_GATEWAY:-Fake}
      Payments__Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Payments__Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      # E-shop krok 23: oznámení push – Web zná od mikroservis M2C jen VEŘEJNÝ klíč VAPID (prohlížeč ho potřebuje v push.js);
      # soukromým podepisuje zprávy jen služba notifications-api.
      PushNotifications__VapidPublicKey: ${PUSH_VAPID_PUBLIC_KEY:-}
      # Mikroservisy M2C: zařízení push, oznámení k práci a „Dejte mi vědět“ ze služby notifications-api (její servisní klíč).
      Services__notifications-api__http__0: http://notifications-api:8080
      NotificationsApi__ApiKey: ${NOTIFICATIONS_API_KEY:?Chybí NOTIFICATIONS_API_KEY v .env}
      # E-shop krok 26B: dopravce (simulátor carrier-sim) – Web zakládá zásilky přes jeho API se svým klíčem u dopravce.
      Services__carrier-sim__http__0: http://carrier-sim:8080
      # E-shop krok 26C: podpis webhooků dopravce (/api/shipping/carrier-webhook) – stejné tajemství jako carrier-sim.
      Carrier__WebhookSecret: ${CARRIER_WEBHOOK_SECRET:?Chybí CARRIER_WEBHOOK_SECRET v .env}
      Carrier__ApiKey: ${CARRIER_API_KEY:?Chybí CARRIER_API_KEY v .env}
    # Škálování krok 5: víc kopií Webu (produkce 2 – production.env). Všechny sdílí volume web-data: klíče Data Protection
    # musí být společné (cookie přihlášení a formuláře z jedné kopie platí i v druhé), logy má každá vlastní soubor.
    # Workery s časovačem běží jen na vedoucí kopii (zámek v PostgreSQL), požadavky rozděluje Caddy (compose.cloud.yaml).
    deploy:
      replicas: ${WEB_REPLICAS:-1}
    volumes:
      - web-data:/data
    # Lokálně: jedna kopie = port 8080. Víc kopií lokálně = rozsah (WEB_PORT=8080-8081), každá dostane jeden port.
    # V cloudu Web publikovaný není (compose.cloud.yaml), požadavky přichází jen přes Caddy.
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

# Pojmenované volumes = trvalá data. Přežijí "docker compose down" i nový build image.
# Smaže je jen "docker compose down -v" (pozor!).
volumes:
  rabbitmq-data:
  inventory-data:
  reporting-data:   # mikroservisy M1: jen logy služby přehledu
  notifications-data:   # mikroservisy M2C: jen logy služby Notifications
  carrier-data:   # e-shop krok 26A: zásilky simulovaného dopravce (soubor, nezálohuje se – jde o „cizí“ data)
  web-data:
  postgres-data:   # škálování krok 1 a 3: data PostgreSQL – nemazat (zálohuje pg_dump v backup.sh)
