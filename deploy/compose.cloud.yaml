# Cloud krok 5: doplněk ke compose.yaml JEN pro VM v cloudu – Caddy s HTTPS a heslem před Webem.
# Lokálně se nepoužívá (docker compose up na PC dál vystaví Web na localhost:8080).
#
# Na VM ho zapne řádek v .env (Compose pak čte oba soubory, druhý doplňuje/přepisuje první):
#   COMPOSE_FILE=compose.yaml:compose.cloud.yaml
# Ručně totéž: docker compose -f compose.yaml -f compose.cloud.yaml up -d

services:
  web:
    # Web už není publikovaný ven – dostane se k němu jen Caddy uvnitř sítě Compose.
    # !reset smaže "ports" zděděné z compose.yaml (nestačí je jen nevypsat – seznamy se slučují).
    ports: !reset []

  # Krok 11: dashboard jen přes Caddy (https://dashboard.<doména>, basic auth) – ne přímo z VM.
  aspire-dashboard:
    ports: !reset []

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"     # Let's Encrypt ověření + přesměrování na https
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?chybí DOMAIN v .env (např. minishop-xx.duckdns.org)}
      BASIC_AUTH: ${BASIC_AUTH:-on}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certifikáty a účet u Let's Encrypt. Bez volume by Caddy po každém restartu žádal o nový
      # certifikát a brzy narazil na limity Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
