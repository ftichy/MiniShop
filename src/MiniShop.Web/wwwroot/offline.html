<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Jste offline – MiniShop</title>
    <!-- Vzhled krok D: stránku ukáže service worker (sw.js), když se stránka nedá načíst ze sítě.
         Samostatná (styl přímo tady, žádný skript) – musí fungovat bez jediného dalšího požadavku na server.
         Po změně tohoto souboru změnit PRECACHE_VERSION v sw.js (hlídá PwaTests). -->
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; box-sizing: border-box;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7fb; color: #111827; }
        .card { max-width: 24rem; text-align: center; background: #fff; border: 1px solid #e6e8ef; border-radius: 0.875rem;
                padding: 2rem 1.5rem; box-shadow: 0 4px 16px rgba(17, 24, 39, 0.08); }
        img { width: 72px; height: 72px; border-radius: 1rem; }
        h1 { font-size: 1.4rem; margin: 1rem 0 0.5rem; }
        p { color: #6b7280; margin: 0 0 1.5rem; line-height: 1.5; }
        a { display: inline-block; min-height: 2.75rem; line-height: 2.75rem; padding: 0 1.5rem; border-radius: 0.5rem;
            background: #4f46e5; color: #fff; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <main class="card" data-track="offline-page">
        <img src="/icons/icon-192.png" alt="" />
        <h1>Jste offline</h1>
        <p>Stránku se nepodařilo načíst – telefon teď nemá připojení k internetu. Až bude signál, zkuste to znovu.</p>
        <!-- Prázdný odkaz = znovu načíst stejnou adresu (bez skriptu – CSP i jednoduchost). -->
        <a href="" data-track="offline-retry">Zkusit znovu</a>
    </main>
</body>
</html>
